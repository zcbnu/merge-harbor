<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>海风港合成 Merge Harbor</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/palette.css"><link rel="stylesheet" href="style.css">
</head><body>
<div id="bgBefore" class="bg"></div><div id="bgAfter" class="bg"></div>
<div id="app">
 <header id="hud">
  <div class="stat"><img src="assets/ui/icon_energy.svg" alt=""><span id="energy">0</span><small id="regen"></small></div>
  <div class="stat"><img src="assets/ui/icon_coin.svg" alt=""><span id="coins">0</span></div>
  <div class="stat"><img src="assets/ui/icon_star.svg" alt=""><span id="stars">0</span></div>
  <div class="stat lvl">Lv <span id="level">1</span><div class="xpbar"><div id="xpfill"></div></div></div>
 </header>
 <section id="orders"></section>
 <section id="boardwrap"><div id="board"></div></section>
 <footer id="info"><span id="selname">点击生成器产出物品，拖动两个相同物品合成升级</span>
  <button id="sellBtn" disabled>出售</button><button id="renoBtn" >装修 🔨</button><button id="resetBtn">重置</button></footer>
 <div id="toast"></div>
 <div id="renoPanel" class="modal"><div class="sheet"><div class="sheetHead"><b id="renoTitle"></b><img id="renoClose" src="assets/ui/button_close.svg" alt="关闭"></div><div id="renoProg"></div><div id="renoList"></div></div></div>
 <div id="dialog" class="modal"><div class="dlgBox"><img id="dlgPortrait" src="assets/characters/lan.svg" alt=""><div><div id="dlgName"></div><div id="dlgText"></div><small>点击继续 ▸</small></div></div></div>
</div>
<script src="game.js"></script>
</body></html>
